name: Build & Release Apps

# Push to `staging` → staging build (version bumped from commit messages)
# Push to `main`    → production build of the version merged from staging
# Each run: APK + AAB + IPA → committed to builds/<channel>/v<version>/, tagged, GitHub Release,
# uploaded to Google Drive and posted to Slack (channel picked in the app or via secrets).
on:
  push:
    branches: [staging, main]
    paths-ignore:
      - 'builds/**'
      - '**/*.md'
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto = from Conventional Commits)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      ios:
        description: 'Build the iOS IPA (macOS runner)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  EXPO_NO_TELEMETRY: 1

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
      tag: ${{ steps.v.outputs.tag }}
      channel: ${{ steps.v.outputs.channel }}
      changelog: ${{ steps.v.outputs.changelog }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: v
        name: Compute semantic version
        run: node scripts/version.mjs --channel ${{ github.ref_name == 'main' && 'production' || 'staging' }} --bump ${{ inputs.bump || 'auto' }}

  quality:
    name: Lint · format · types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json
      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm run build
      - name: Mobile
        working-directory: mobile
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
      - name: GraphQL codegen is up to date
        working-directory: mobile
        run: |
          npm run codegen
          git diff --exit-code -- src/gql || (echo "::error::Run 'npm run codegen' in mobile/ and commit src/gql" && exit 1)

  android:
    name: Android (APK + AAB)
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: ${{ needs.prepare.outputs.channel }}
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      APP_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      EXPO_PUBLIC_API_URL: ${{ secrets.API_URL || vars.API_URL || 'https://spentiva.exyconn.com/graphql' }}
      ARTIFACT_BASE: Spentiva-v${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.channel }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Install dependencies
        run: npm ci
      - name: Release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Signing with the upload keystore"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set – signing with the debug key (fine for sideloading, not for Play Store)"
          fi
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build APK + AAB
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> android/gradle.properties
          cd android
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Collect outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$ARTIFACT_BASE.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/$ARTIFACT_BASE.aab"
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: mobile/dist/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS (IPA)
    needs: [prepare, quality]
    if: vars.ENABLE_IOS_BUILD != 'false' && (github.event_name != 'workflow_dispatch' || inputs.ios)
    runs-on: macos-latest
    timeout-minutes: 90
    environment: ${{ needs.prepare.outputs.channel }}
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      APP_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      EXPO_PUBLIC_API_URL: ${{ secrets.API_URL || vars.API_URL || 'https://spentiva.exyconn.com/graphql' }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.spentiva.app' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install dependencies
        run: npm ci
      - name: Expo prebuild (+ pod install)
        run: npx expo prebuild --platform ios --clean
      - name: Build IPA
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p dist
          bash ../scripts/ios-build.sh "dist/Spentiva-v${APP_VERSION}-${{ needs.prepare.outputs.channel }}.ipa"
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: mobile/dist/*.ipa
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish (repo · release · Drive · Slack)
    needs: [prepare, android, ios]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.channel }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      TAG: ${{ needs.prepare.outputs.tag }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Bump version & collect builds
        run: |
          ls -lh artifacts
          (cd mobile && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          node scripts/collect-builds.mjs --from artifacts --channel "$CHANNEL" --version "$VERSION" --version-code "$VERSION_CODE" --tag "$TAG"
      - name: Commit, push & tag
        run: |
          git config user.name "spentiva-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json builds
          git commit -m "chore(release): v$VERSION ($CHANNEL) [skip ci]" || echo "Nothing to commit"
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && break
            echo "Push failed (attempt $attempt), retrying…"; sleep 5
          done
          git tag -f -a "$TAG" -m "Spentiva $TAG"
          git push -f origin "$TAG"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.prepare.outputs.changelog }}
        run: |
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" artifacts/* \
            --title "Spentiva v$VERSION ($CHANNEL)" \
            --notes "$NOTES" \
            --target "$RELEASE_SHA" \
            ${{ needs.prepare.outputs.channel == 'staging' && '--prerelease' || '--latest' }}
          echo "release_url=${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_OUTPUT"
      - name: Upload to Google Drive
        id: drive
        continue-on-error: true
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_SHARE_ANYONE: ${{ vars.GDRIVE_SHARE_ANYONE }}
        run: node scripts/upload-drive.mjs artifacts "Spentiva/$CHANNEL/v$VERSION"
      - name: Post to Slack
        continue-on-error: true
        env:
          API_URL: ${{ secrets.API_URL || vars.API_URL || 'https://spentiva.exyconn.com/graphql' }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          DRIVE_URL: ${{ steps.drive.outputs.drive_url }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: node scripts/notify-slack.mjs artifacts
      - name: Summary
        env:
          DRIVE_URL: ${{ steps.drive.outputs.drive_url }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          {
            echo "## Spentiva v$VERSION ($CHANNEL)"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in artifacts/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
            echo ""
            echo "- Repo: \`builds/$CHANNEL/v$VERSION/\`"
            echo "- Release: $RELEASE_URL"
            [ -n "$DRIVE_URL" ] && echo "- Google Drive: $DRIVE_URL"
            [ "$IOS_RESULT" != "success" ] && echo "- ⚠️ iOS build: $IOS_RESULT"
            true
          } >> "$GITHUB_STEP_SUMMARY"
