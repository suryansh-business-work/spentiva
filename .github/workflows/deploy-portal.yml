name: Deploy Portal

# Builds the admin portal (static React app served by nginx) into a GHCR image and runs it on the
# VPS behind the host nginx at https://spentiva.portal.exyconn.com
# (container `spentiva-portal`, host port 127.0.0.1:PORTAL_PORT → 80).
on:
  push:
    branches: [staging, main]
    paths:
      - 'portal/**'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-portal
  cancel-in-progress: false

jobs:
  quality:
    name: Lint · format · types · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: GraphQL codegen is up to date
        run: |
          npm run codegen
          git diff --exit-code -- src/gql || (echo "::error::Run 'npm run codegen' in portal/ and commit src/gql" && exit 1)

  deploy:
    name: Build image & deploy
    needs: quality
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}-portal
      PORTAL_PORT: ${{ vars.PORTAL_PORT || '4101' }}
      CONTAINER: spentiva-portal
      API_URL: ${{ secrets.API_URL || vars.API_URL || 'https://spentiva.exyconn.com/graphql' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: API origin for the CSP
        run: echo "API_ORIGIN=$(node -e 'console.log(new URL(process.env.API_URL).origin)')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: portal
          push: true
          build-args: VITE_API_URL=${{ env.API_URL }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal

      - name: Deploy to VPS (SSH + Docker)
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE,TAG,GHCR_USER,GHCR_TOKEN,PORTAL_PORT,CONTAINER,API_ORIGIN
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE:$TAG"
            docker logout ghcr.io
            docker rm -f "$CONTAINER" 2>/dev/null || true
            docker run -d --name "$CONTAINER" --restart unless-stopped -p "127.0.0.1:$PORTAL_PORT:80" \
              --memory 64m -e API_ORIGIN \
              "$IMAGE:$TAG"
            for i in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:$PORTAL_PORT/healthz" >/dev/null; then echo "Portal healthy"; break; fi
              if [ "$i" = 20 ]; then echo "Portal did not become healthy"; docker logs --tail 80 "$CONTAINER"; exit 1; fi
              sleep 2
            done
            docker image prune -f >/dev/null

      - name: Summary
        run: |
          {
            echo "## Portal"
            echo "- Image: \`$IMAGE:${GITHUB_SHA::7}\`"
            echo "- URL: https://spentiva.portal.exyconn.com"
            echo "- API: $API_URL"
          } >> "$GITHUB_STEP_SUMMARY"
